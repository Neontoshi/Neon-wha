<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NeonWhat Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>NeonWhat Settings</h1>

  <label>
    <input type="checkbox" id="close-to-tray" />
    Close to tray
  </label>

  <label>
    <input type="checkbox" id="notifications-enabled" />
    Enable native notifications
  </label>

  <label>
    Toggle shortcut
    <input type="text" id="shortcut-toggle" placeholder="Ctrl+Shift+W" />
  </label>

  <button id="save">Save</button>
  <span id="status"></span>

  <script src="settings.js"></script>
</body>
</html>
